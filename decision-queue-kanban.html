<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin Siege — decision queue</title>
<style>
/* ---------------------------------------------------------------- tokens --
   Values are the validated reference palette. Lanes are NOT colour-coded:
   five hues including a mandatory red and green cannot clear the all-pairs
   CVD floors in both modes, and in a kanban the column position already
   encodes the state. Colour survives only as small status badges, each of
   which carries an icon and a word as well.                                */
:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --plane:          #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --meter-track:    #e1e0d9;
  --meter-fill:     #2a78d6;
  --st-good:        #0ca30c;
  --st-warning:     #fab219;
  --st-serious:     #ec835a;
  --st-critical:    #d03b3b;
  --ink-good:       #006300;
  --shadow:         0 1px 2px rgba(11,11,11,.06), 0 1px 8px rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --plane:          #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --meter-track:    #2c2c2a;
    --meter-fill:     #3987e5;
    --ink-good:       #0ca30c;
    --shadow:         0 1px 2px rgba(0,0,0,.5), 0 1px 8px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --plane:          #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255,255,255,0.10);
  --meter-track:    #2c2c2a;
  --meter-fill:     #3987e5;
  --ink-good:       #0ca30c;
  --shadow:         0 1px 2px rgba(0,0,0,.5), 0 1px 8px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 24px clamp(12px, 3vw, 32px) 64px;
}
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--text-secondary); font-size: 13px; margin: 0; }
.sub code { font-size: 12px; color: var(--text-muted); }

header.page { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
              justify-content: space-between; margin-bottom: 20px; }

/* ------------------------------------------------------------- controls -- */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select {
  font: inherit; font-size: 13px; color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--baseline); }
button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1);
                              border-color: var(--text-primary); }

/* ------------------------------------------------------------ stat row -- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
         gap: 10px; margin-bottom: 22px; }
.tile { background: var(--surface-1); border: 1px solid var(--border);
        border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; display: block; }
.tile .k { font-size: 12px; color: var(--text-secondary); display: flex;
           align-items: center; gap: 6px; }
.tile .k .dot { width: 8px; height: 8px; border-radius: 50%; flex: none;
                background: var(--text-muted); }

/* ---------------------------------------------------------------- board -- */
.board { display: grid; gap: 12px; align-items: start;
         grid-template-columns: repeat(5, minmax(210px, 1fr)); overflow-x: auto; }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(210px,1fr)); } }
@media (max-width: 620px)  { .board { grid-template-columns: 1fr; } }

.lane { background: var(--surface-1); border: 1px solid var(--border);
        border-radius: 12px; padding: 10px; min-height: 96px; }
.lane.drop { outline: 2px dashed var(--meter-fill); outline-offset: -4px; }
.lane > h2 { font-size: 13px; margin: 2px 2px 4px; display: flex; gap: 7px;
             align-items: baseline; }
.lane > h2 .ic { font-size: 13px; width: 1.1em; text-align: center; flex: none;
                 color: var(--text-secondary); }
.lane > h2 .n  { margin-left: auto; color: var(--text-muted);
                 font-variant-numeric: tabular-nums; font-weight: 400; }
.lane .hint { font-size: 11.5px; color: var(--text-muted); margin: 0 2px 10px 2px;
              padding-bottom: 8px; border-bottom: 1px solid var(--gridline); }

/* ---------------------------------------------------------------- cards -- */
.card { background: var(--plane); border: 1px solid var(--border); border-radius: 10px;
        padding: 10px; margin-bottom: 8px; cursor: grab; }
.card:active { cursor: grabbing; }
.card.dragging { opacity: .45; }
.card h3 { font-size: 13px; margin: 0 0 7px; line-height: 1.35; font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.u { font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
     flex: none; min-width: 46px; }
.meter { flex: 1; height: 6px; background: var(--meter-track); border-radius: 3px;
         overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--meter-fill);
             border-radius: 0 3px 3px 0; }
.blk { font-size: 11px; color: var(--text-muted); flex: none; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
         padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border);
         color: var(--text-secondary); background: var(--surface-1); }
.badge .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }

.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 7px; }
.chip { font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--gridline);
        border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, Consolas, monospace; }
.note { font-size: 11.5px; color: var(--text-secondary); margin: 7px 0 0;
        padding-top: 7px; border-top: 1px solid var(--gridline); }
.mv { width: 100%; margin-top: 8px; font-size: 11.5px; padding: 3px 6px; }

/* ---------------------------------------------------------------- table -- */
table { border-collapse: collapse; width: 100%; background: var(--surface-1);
        border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 8px 10px; font-size: 12.5px;
         border-bottom: 1px solid var(--gridline); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }

/* ----------------------------------------------------------------- json -- */
.json { margin-top: 22px; }
textarea { width: 100%; min-height: 320px; font: 12px/1.5 ui-monospace, Consolas, monospace;
           color: var(--text-primary); background: var(--surface-1);
           border: 1px solid var(--border); border-radius: 10px; padding: 12px; resize: vertical; }
.msg { font-size: 12.5px; margin-left: 4px; }
.msg.ok  { color: var(--ink-good); }
.msg.err { color: var(--st-critical); }
[hidden] { display: none !important; }
</style>
</head>
<body>

<header class="page">
  <div>
    <h1>Goblin Siege — decision queue</h1>
    <p class="sub" id="prov"></p>
  </div>
  <div class="controls">
    <button id="viewBoard" aria-pressed="true">Board</button>
    <button id="viewTable" aria-pressed="false">Table</button>
    <button id="themeBtn">Theme</button>
    <button id="jsonBtn" aria-pressed="false">Edit data</button>
    <button id="resetBtn">Reset</button>
  </div>
</header>

<section class="stats" id="stats"></section>

<main>
  <div class="board" id="board"></div>
  <div id="tableWrap" hidden></div>
</main>

<section class="json" id="jsonPanel" hidden>
  <p class="sub" style="margin-bottom:8px">
    Edit the JSON and press <strong>Apply</strong>. Dragging a card, or using its

    press Reset.
    <span class="msg" id="msg"></span>
  </p>
  <div class="controls" style="margin-bottom:8px">
    <button id="applyBtn">Apply</button>
    <button id="copyBtn">Copy</button>
  </div>
  <textarea id="jsonBox" spellcheck="false" aria-label="Board data as JSON"></textarea>
</section>

  warning:  { c: "var(--st-warning)",  ic: "⚠" },
  serious:  { c: "var(--st-serious)",  ic: "◆" },
  critical: { c: "var(--st-critical)", ic: "✗" }
};

// Bumped v1 -> v2 for the 2026-08-06 regeneration. load() prefers localStorage over SEED, so
// without this every browser that had ever opened the old board would keep showing it and the
// refresh would be invisible in exactly the place it was supposed to appear.
const KEY = "gs-decision-queue-v2";
let data = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* fall through to seed */ }
  return structuredClone(SEED);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
}

// Unranked sorts FIRST, not last. An item the ranking run never scored is not an item it scored
// zero, and the default numeric sort cannot tell those apart - it would file the nine code-review
// findings (one of which is a crash) below a u=1.75 nice-to-have and call that a priority order.
const byPriority = (a, b) => {
  if (!!a.unranked !== !!b.unranked) return a.unranked ? -1 : 1;
  return (+b.utility || 0) - (+a.utility || 0);
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  $("#prov").innerHTML =
    esc(data.meta.source) + " &middot; ranking from <code>" + esc(data.meta.ranking) +
    "</code> &middot; drawn <code>" + esc(data.meta.drawn) + "</code>";

  const maxU = Math.max(1, ...data.cards.map((c) => +c.utility || 0));

  // --- stat tiles: one per lane, plus the top eligible item ---------------
  const tiles = data.lanes.map((l) => {
    const n = data.cards.filter((c) => c.lane === l.id).length;
    return '<div class="tile"><span class="v">' + n + '</span>' +
           '<span class="k"><span class="ic">' + esc(l.icon) + '</span>' + esc(l.name) + '</span></div>';
  });
  const elig = data.cards.filter((c) => c.lane === "eligible").sort(byPriority)[0];
  tiles.push('<div class="tile"><span class="v" style="font-size:15px;line-height:1.7">' +
             (elig ? esc(elig.title.split(/[-(]/)[0].trim()) : "—") +
             '</span><span class="k">top of Eligible</span></div>');
  $("#stats").innerHTML = tiles.join("");

  // --- board --------------------------------------------------------------
  $("#board").innerHTML = data.lanes.map((l) => {
    const cards = data.cards.filter((c) => c.lane === l.id).sort(byPriority);
    return '<section class="lane" data-lane="' + esc(l.id) + '">' +
      '<h2><span class="ic">' + esc(l.icon) + '</span>' + esc(l.name) +
      '<span class="n">' + cards.length + '</span></h2>' +
      '<p class="hint">' + esc(l.hint) + '</p>' +
      cards.map((c) => cardHTML(c, maxU)).join("") +
    '</section>';
  }).join("");

  wireDnD();
  renderTable(maxU);
  $("#jsonBox").value = JSON.stringify(data, null, 2);
}

function cardHTML(c, maxU) {
  const u = +c.utility || 0;
  const pct = maxU ? Math.round((u / maxU) * 100) : 0;

  const badges = [];
  if (c.status && STATUS[c.status]) {
    badges.push('<span class="badge"><span class="sw" style="background:' + STATUS[c.status].c +
      '"></span>' + STATUS[c.status].ic + " " + esc(c.statusLabel || c.status) + "</span>");
  }
  if (c.ticket) badges.push('<span class="badge">' + esc(c.ticket) +
    (c.agent ? " · " + esc(c.agent) : "") + "</span>");
  // Says out loud that there is no score, so a card with no meter cannot be misread as u=0.
  if (c.unranked) badges.push('<span class="badge">unranked</span>');

  const opts = data.lanes.map((l) =>
    '<option value="' + esc(l.id) + '"' + (l.id === c.lane ? " selected" : "") + ">" +
    "Move to " + esc(l.name) + "</option>").join("");

  return '<article class="card" draggable="true" data-id="' + esc(c.id) + '">' +
    "<h3>" + esc(c.title) + "</h3>" +
    (badges.length ? '<div class="badges">' + badges.join("") + "</div>" : "") +
    (u > 0
      ? '<div class="row"><span class="u">u=' + u.toFixed(2).replace(/\.?0+$/, "") + '</span>' +
        '<span class="meter"><i style="width:' + pct + '%"></i></span>' +
        '<span class="blk">blk ' + esc(c.block) + "</span></div>"
      : "") +
    (c.missing && c.missing.length
      ? '<div class="chips">' + c.missing.map((m) => '<span class="chip">' + esc(m) + "</span>").join("") + "</div>"
      : "") +
    (c.note ? '<p class="note">' + esc(c.note) + "</p>" : "") +
    '<select class="mv" aria-label="Move card">' + opts + "</select>" +
  "</article>";
}

function renderTable(maxU) {
  const rows = data.cards
    .slice()
    .sort(byPriority)
    .map((c) => "<tr><td>" + esc(c.title) + "</td><td>" +
      esc((data.lanes.find((l) => l.id === c.lane) || {}).name || c.lane) + "</td>" +
      '<td class="num">' + (+c.utility ? (+c.utility).toFixed(2) : "—") + "</td>" +
      "<td>" + esc(c.block) + "</td><td>" + esc((c.missing || []).join(", ") || "—") + "</td>" +
      "<td>" + esc(c.statusLabel || "—") + "</td><td>" + esc(c.note || "") + "</td></tr>").join("");
  $("#tableWrap").innerHTML =
    "<table><thead><tr><th>Item</th><th>Lane</th><th>u</th><th>Block</th>" +
    "<th>Missing</th><th>Flag</th><th>Note</th></tr></thead><tbody>" + rows + "</tbody></table>";
}

function move(id, lane) {
  const c = data.cards.find((x) => x.id === id);
  if (!c || c.lane === lane) return;
  c.lane = lane;
  save();
  render();
}

function wireDnD() {
  document.querySelectorAll(".card").forEach((el) => {
    el.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", el.dataset.id);
      e.dataTransfer.effectAllowed = "move";
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
  });
  document.querySelectorAll(".mv").forEach((sel) => {
    sel.addEventListener("change", (e) => {
      e.stopPropagation();
      move(sel.closest(".card").dataset.id, sel.value);
    });
  });
  document.querySelectorAll(".lane").forEach((lane) => {
    lane.addEventListener("dragover", (e) => { e.preventDefault(); lane.classList.add("drop"); });
    lane.addEventListener("dragleave", () => lane.classList.remove("drop"));
    lane.addEventListener("drop", (e) => {
      e.preventDefault();
      lane.classList.remove("drop");
      move(e.dataTransfer.getData("text/plain"), lane.dataset.lane);
    });
  });
}

// --- controls --------------------------------------------------------------
$("#viewBoard").onclick = () => setView(true);
$("#viewTable").onclick = () => setView(false);
function setView(board) {
  $("#board").hidden = !board;
  $("#tableWrap").hidden = board;
  $("#viewBoard").setAttribute("aria-pressed", String(board));
  $("#viewTable").setAttribute("aria-pressed", String(!board));
}

$("#themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = cur ? cur : (sysDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", now === "dark" ? "light" : "dark");
};

$("#jsonBtn").onclick = () => {
  const p = $("#jsonPanel");
  p.hidden = !p.hidden;
  $("#jsonBtn").setAttribute("aria-pressed", String(!p.hidden));
};

$("#applyBtn").onclick = () => {
  const m = $("#msg");
  try {
    const next = JSON.parse($("#jsonBox").value);
    if (!next.lanes || !next.cards) throw new Error("needs a lanes array and a cards array");
    data = next;
    save();
    render();
    m.className = "msg ok";
    m.textContent = "Applied.";
  } catch (err) {
    m.className = "msg err";
    m.textContent = "Not applied - " + err.message;
  }
};

$("#copyBtn").onclick = async () => {
  const m = $("#msg");
  try {
    await navigator.clipboard.writeText($("#jsonBox").value);
    m.className = "msg ok"; m.textContent = "Copied.";
  } catch (e) {
    $("#jsonBox").select();
    m.className = "msg ok"; m.textContent = "Selected - press Ctrl+C.";
  }
};

$("#resetBtn").onclick = () => {
  data = structuredClone(SEED);
  save();
  render();
  const m = $("#msg"); m.className = "msg ok"; m.textContent = "Reset to the seeded data.";
};

render();
</script>
</body>
</html>
