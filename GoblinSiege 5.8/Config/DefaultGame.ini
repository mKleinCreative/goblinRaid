[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=E8E250B24DBAABDD7DAFD698248DDF75
ProjectName=Third Person Game Template

; Explicit map list for packaging (#388, 2026-08-30). Without this the cooker only cooks maps
; reachable by HARD reference from the startup map - L_MainMenu's "New Raid" button references
; L_Tutorial_Island only via a soft FName string (OpenLevel by name), so the cooker never
; discovered it needed to be cooked at all. A package built without this list boots into a working
; main menu that silently cannot start a raid - the exact bug this fixes. Only the two real
; gameplay maps are listed; the test/scratch maps (L_Hamlet_*, L_CombatArena*, GS_BurnTest,
; L_LevelGen_Scratch) are deliberately left out of a player-facing build.
; bCookAll (2026-08-30) forced the ENTIRE Content/ folder to cook regardless of reference type -
; ~9.9GB of source content, most of it unrelated marketplace packs, producing a 3.2-4.1GB pak far
; over itch.io's upload limit. Root cause it was working around was real (see #388): several
; classes load Niagara systems, meshes and the fracture library by TSoftObjectPtr/FSoftObjectPath
; string literal at runtime, which the cooker never discovers from a hard-reference walk starting
; at L_MainMenu/L_Tutorial_Island. #397 (2026-08-31) replaced the blanket flag with an exact grep
; of every `TEXT("/Game/...")` FSoftObjectPath literal in Source/GoblinSiege/ - the real dependency
; list turns out to be five small VFX leaf folders (under 100MB combined) plus /Game/Destruction
; (the 42-house fracture library, ~1.8GB, scanned by folder convention rather than referenced by
; name - GSCrumbleComponent/GSBuildingObjective read it at runtime). Everything else bCookAll was
; sweeping in - CombatMasterBundle, the other 10+ VFX marketplace packs, the audio bundle beyond
; what montages/objectives actually load, the test/scratch maps - was never reached by any actual
; code path and is dropped. If a future playtest finds something silently missing again per #388's
; symptom (LoadSynchronous returning null), grep Source/ for its FSoftObjectPath literal the same
; way and add that one folder - do not reach for bCookAll again, it hides exactly this kind of gap
; instead of surfacing it.
[/Script/UnrealEd.ProjectPackagingSettings]
bCookAll=False
+MapsToCook=(FilePath="/Game/Maps/L_MainMenu")
+MapsToCook=(FilePath="/Game/Maps/L_Tutorial_Island")
+DirectoriesToAlwaysCook=(Path="/Game/Destruction")
+DirectoriesToAlwaysCook=(Path="/Game/VFX")
+DirectoriesToAlwaysCook=(Path="/Game/DreamscapeSeries/DreamscapeFarmlands/Particles")
+DirectoriesToAlwaysCook=(Path="/Game/EnvironmentVFX/VFX/EnvironmentDust/Systems")
+DirectoriesToAlwaysCook=(Path="/Game/Vefects/Free_Fire/Shared/Particles")
+DirectoriesToAlwaysCook=(Path="/Game/VolcanoEnvironmentVFX/VFX/Niagara")

