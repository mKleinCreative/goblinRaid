[/Script/GoblinSiege.GSBurnMaskSubsystem]
; 1024 over a 2.9x4.0 km landscape is 404 uu/texel - a 10240uu field gets only
; 25 texels and the char reads as blobs. 4096 puts ~6 texels on each 640uu cell
; for 64 MB. Raised 2026-07-31 after measuring the real landscape extent.
BurnMaskResolution=4096

[/Script/GoblinSiege.GSHordeSubsystem]
; Which pawn a horn blast spawns. Spawning the C++ class directly gives an invisible goblin with
; no mesh and no anim BP - GSHordeSubsystem.h:175. Unset, SummonWave refuses loudly and summons 0.
HordeGoblinClassPath=/Game/Blueprints/BP_HordeGoblin.BP_HordeGoblin_C
; The order beacon (#141) - the visible marker a point command plants. Unlike the goblin above,
; unset is survivable: orders are still issued and still obeyed, the player just cannot see where he
; sent them, and ResolveOrderMarkerClass warns once.
OrderMarkerClassPath=/Game/Blueprints/BP_HordeOrderMarker.BP_HordeOrderMarker_C

[/Script/GoblinSiege.GSCorruptionSubsystem]
; World corruption - ledger rulings 40-45 and 62, ticket #309.
; 10 Hz: the output stage is a lerp, not a simulation. A per-frame tick would buy nothing visible.
TickIntervalSeconds=0.1
; L_CombatArena - the default startup map, and the only map anything since 2026-08-07 has actually
; been watched in - has NO ExponentialHeightFog. Without this the feature appears to do nothing on
; the one map it will be judged in. Set False only for a map that owns its own fog deliberately.
bSpawnMissingAtmosphereActors=True
; Set False on a map with baked lighting: a Static DirectionalLight cannot show a runtime colour
; change at all, and Stationary shows the direct change while the baked indirect stays put.
; GS.Corruption.Dump reports the mobility it actually found, so check there before changing this.
bDriveDirectionalLight=True
; Soft path, deliberately empty. A BP subclass of AGSCorruptionDirector is how a level artist
; retunes the look per map; empty falls back to the C++ class, which is correct and visible on its
; own. Never a hard TSubclassOf default - same rule as HordeGoblinClassPath above.
CorruptionDirectorClassPath=

; ---------------------------------------------------------------------------------------------
; CommonUI (#335, ruling 71). Replicated from ACF's Config/DefaultGame.ini - the project enables the
; CommonUI plugin (MyProject.uproject) and links the module, but until now had never configured it
; because no class had ever used it.
;
; InputData is the one that bites: without it CommonUI logs missing-input-data errors and every
; action icon comes back blank. /CommonUI/GenericInputData is Epic's own default, shipped in
; Engine/Plugins/Runtime/CommonUI/Content - verified present on this install.
[/Script/CommonUI.CommonUISettings]
CommonButtonAcceptKeyHandling=TriggerClick

[/Script/CommonInput.CommonInputSettings]
InputData=/CommonUI/GenericInputData.GenericInputData_C
