; Registers the GoblinSiege mixer spine. Before this, the project had no sound
; class, submix, mix or concurrency asset at all, and every one of the ~1050
; pack cues played unrouted and unattenuated.
; SM_GS_Master is the master submix, so the other SM_GS_* submixes attach to it
; automatically as orphans - ParentSubmix is read-only from script and does not
; need setting by hand.
