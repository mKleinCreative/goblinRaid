; ACF UI stack (#335, ruling 71). Both lines are REPLICATED from ACF's own
; Config/DefaultEngine.ini, which does NOT reach a project's config hierarchy - the same trap that
; left every ACF GAS setting at its default until #228, where an empty HealthAttribute meant
; nothing in the game could die. See the block in Config/DefaultPlugins.ini for the full story.
;
; GameUserSettingsClassName: without it, GetGameUserSettings() returns a plain UGameUserSettings and
; every ACF settings widget's cast to UAUTGameUserSettings fails - the audio and gameplay tabs would
; move, save, and do nothing at all.
;   TEMPORARY VALUE. This points at ACF's own BP subclass so the plumbing is provable NOW, before any
;   C++ exists. Stage 3 of #335 replaces it with /Script/GoblinSiege.GSGameUserSettings, which is
;   also where the volume-application path stops writing into the USoundClass assets (see
;   UAUTUIFunctionLibrary::SetSoundClassVolume, whose whole body is
;   `TargetClass->Properties.Volume = NewVolume;` - no mix, no override, and it dirties the asset).
GameUserSettingsClassName=/AscentCombatFramework/UITools/Blueprints/AUT_GameSettings_BP.AUT_GameSettings_BP_C
;
; GameViewportClientClassName: CommonUI's input routing installs from the viewport client. Without
; it, focus and back-navigation misbehave in ways that read as "UMG is flaky" rather than as a
; missing config line.
GameViewportClientClassName=/Script/CommonUI.CommonGameViewportClient

