; 2026-08-24 (#298): the engine default is UnfocusedVolumeMultiplier=0.0
; (BaseEngine.ini [Audio]), which silences PIE the moment the window loses focus.
; That makes audio impossible to verify while driving the editor from a tool or a
; second monitor - every listening test has to be done click-focused in the
; viewport. 1.0 keeps sound running when unfocused.
; NOTE: this is an [Audio] section, so it applies to packaged builds too. If the
; game should mute when alt-tabbed at ship, set this back to 0.0 then.
[Audio]
UnfocusedVolumeMultiplier=1.0

; ---------------------------------------------------------------------------
; Geometry-collection settling (2026-09-09, #402).
;
; UGSCrumbleComponent stops a collapsed building simulating once it has come to
; rest, via SetSimulatePhysics(false). On a Geometry Collection that call ONLY
; tears down the physics proxy when this cvar is 1 - the engine default is 0,
; which "preserves legacy behavior of keeping the proxy alive", so without this
; line the freeze runs, logs success, and costs exactly as much as before.
;
; Measured in PIE after GS.Raid.CompleteAllObjectives: 366 collections, 44,762
; simulated pieces, game thread 1381 ms (0.7 FPS). Freezing with this OFF: still
; 366 simulating, 1073 ms. With it ON: 0 simulating, 84 ms.
[SystemSettings]
p.Chaos.GC.DestroyProxyOnSetSimulatePhysicsFalse=1

