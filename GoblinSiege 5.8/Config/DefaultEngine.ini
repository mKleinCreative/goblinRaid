; AUDIO - added by ticket #249 (audio phase A, mixer spine).
;
; PHYSICAL SURFACES: THE NUMBERING BELOW IS PERMANENT. Physical materials store
; the *index*, not the name, so reordering or inserting an entry silently
; reassigns the meaning of every PM_* asset already saved to disk. APPEND ONLY.
; SurfaceType1 is Dirt because it is also the footstep FALLBACK surface - see
; UGSFootstepComponent. Only Dirt and Grass have audio today (the NaPH pack
; ships no others); the rest are named now so that adding sound later is a data
; edit rather than a renumbering.
; ============================================================================
