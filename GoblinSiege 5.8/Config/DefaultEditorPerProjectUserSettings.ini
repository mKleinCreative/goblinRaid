; Project-default editor preferences for Goblin Siege.
;
; This file exists because Michael's Editor Preferences window will not open — clicking it makes the
; level viewport blink and no panel appears. Anything that would normally be a checkbox in there has
; to be set here or through Python instead. Added 2026-08-14 (#160).

[/Script/UnrealEd.EditorLoadingSavingSettings]
; Autosave OFF.
;
; Autosave writes timestamped copies into Saved/Autosaves/ rather than over Content/, so it is not
; destructive on its own — but it fires while an asset is mid-edit, and this project has spent a day
; chasing a behaviour tree that kept coming back stripped. Removing a background writer from that
; picture is worth more than the ten-minute safety net, on a project where every asset is in git and
; LFS anyway.
;
; The real cause of the BT_HordeGoblin damage was NOT autosave: it was four blackboard keys the
; controller writes that BB_HordeGoblin does not carry, which makes the tree's nodes unresolvable
; and gets them stripped at every load. See #153/#154.
bAutoSaveEnable=False

; Left at their defaults so turning autosave back on restores the previous behaviour exactly:
;   AutoSaveTimeMinutes=10
;   AutoSaveWarningInSeconds=10
;   bAutoSaveMaps=True
;   bAutoSaveContent=True
;   AutoSaveMaxBackups=10

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
ServerPortNumber=8000
bAutoStartServer=True
bEnableToolSearch=True

