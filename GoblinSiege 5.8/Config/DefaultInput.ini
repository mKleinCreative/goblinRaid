; ---------------------------------------------------------------------------------------------
; CommonUI input actions (#335, ruling 71). Replicated from ACF's Config/DefaultInput.ini.
;
; This table is what UANSUIPlayerSubsystem::TryGetKeysForAction / TryGetActionsFromKey read, and it
; is what the ANS navbar builds its prompts from. Without it the navbar renders NO key prompts at
; all and Confirm/Cancel have no bindings - the menus open and then cannot be operated by keyboard.
;
; The UI.Action.* tags themselves come from ACF's own Config/DefaultGameplayTags.ini for eight of
; them and from native C++ (ANSUINavigationTags.h) for the rest, so no project tag entry is needed.
;
; Keyboard/mouse first (ruling 71) - the gamepad mappings are kept because they cost nothing and
; make the later gamepad pass a switch rather than a re-authoring.
[/Script/CommonUI.CommonUIInputSettings]
bLinkCursorToGamepadFocus=True
UIActionProcessingPriority=10000
+InputActions=(ActionTag=UI.Action.Confirm,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_Confirm", "Confirm"),KeyMappings=((Key=Gamepad_FaceButton_Bottom),(Key=Enter),(Key=SpaceBar)))
+InputActions=(ActionTag=UI.Action.Cancel,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_Back", "Back"),KeyMappings=((Key=Gamepad_FaceButton_Right),(Key=Escape),(Key=BackSpace)))
+InputActions=(ActionTag=UI.Action.NextTab,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_NextTab", "Next"),KeyMappings=((Key=E),(Key=Gamepad_RightShoulder)))
+InputActions=(ActionTag=UI.Action.PreviousTab,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_PrevTab", "Previous"),KeyMappings=((Key=Q),(Key=Gamepad_LeftShoulder)))
+InputActions=(ActionTag=UI.Action.Next,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_Next", "Right"),KeyMappings=((Key=Gamepad_RightTrigger),(Key=Right)))
+InputActions=(ActionTag=UI.Action.Previous,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_Previous", "Left"),KeyMappings=((Key=Gamepad_LeftTrigger),(Key=Left)))
+InputActions=(ActionTag=UI.Action.Apply,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_Apply", "Apply"),KeyMappings=((Key=F),(Key=Gamepad_FaceButton_Left)))
+InputActions=(ActionTag=UI.Action.Reset,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_Reset", "Reset"),KeyMappings=((Key=R),(Key=Gamepad_FaceButton_Top)))
+InputActions=(ActionTag=UI.Action.Continue,DefaultDisplayName=NSLOCTEXT("[/Script/CommonUI]", "GS_UI_Skip", "Skip"),KeyMappings=((Key=SpaceBar),(Key=Gamepad_FaceButton_Left)))
