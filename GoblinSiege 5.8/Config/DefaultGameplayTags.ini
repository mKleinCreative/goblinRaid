+GameplayTagList=(Tag="Marker.DefenderArrival",DevComment="Goblin Siege: where the DEFENDERS\' reinforcements march in from - the boundary ring. Distinct from Marker.HordeArrival, which is the PLAYER\'s goblin horde walking in on the horn (GSHordeSubsystem.cpp:307). Tagging the boundary ring HordeArrival would spawn the player\'s own goblins on the perimeter, which is the opposite of what it is for. Config-sourced rather than native because no consumer exists yet and a new native tag costs an editor-closed build.")
+GameplayTagList=(Tag="Objective.Topple.Statue",DevComment="Goblin Siege: the seal/monument objective. Satisfied by TOPPLING, not burning - the raid director sweeps UGSTopplableComponent separately because a statue is pulled over, not set alight.")
+GameplayTagList=(Tag="WeaponType.Axe",DevComment="Goblin Siege: ACF weapon taxonomy. UACFWeapon::CanBeEquipped tests EquipmentComponent.AllowedWeaponTypes.Contains(WeaponType) and returns SILENTLY on a miss - an empty AllowedWeaponTypes array blocks every weapon with no log line at all.")
+GameplayTagList=(Tag="WeaponType.Bow",DevComment="Goblin Siege: the player\'s ranged weapon type. Must appear in the character\'s AllowedWeaponTypes or UACFWeapon::CanBeEquipped refuses the equip with no log at all.")
