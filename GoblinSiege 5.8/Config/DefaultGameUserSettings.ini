; Goblin Siege - shipped default quality preset (#335, ruling 70).
;
; This file did not exist. Without it a shipped build gets engine defaults plus whatever the
; first-boot hardware benchmark decides, which means the first thing a player ever sees is
; unreproducible and untestable. ACF ships an equivalent file; like the rest of its config it does
; not reach this project.
;
; Sized for what Config/DefaultEngine.ini actually turns on, not for a generic project:
;   - Lumen for BOTH global illumination and reflections (r.DynamicGlobalIlluminationMethod=1,
;     r.ReflectionMethod=1), so GI and Reflection quality are the two most expensive groups here.
;   - Virtual Shadow Maps on with r.AllowStaticLighting=False - every shadow is dynamic, so shadow
;     quality is a real lever rather than a lightmap tweak.
;   - Substrate on, and hardware ray tracing on. Neither is exposed by any stock scalability group.
;   - r.AntiAliasingMethod is never set, so TSR is the default - which makes ResolutionQuality
;     (screen percentage) the single most effective perf dial the player has.
;
; 0=Low 1=Medium 2=High 3=Epic. GI and Reflection sit one rung below the rest deliberately.
[ScalabilityGroups]
sg.ResolutionQuality=90
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3

[/Script/Engine.GameUserSettings]
bUseVSync=True
bUseDynamicResolution=False
FrameRateLimit=0.000000
