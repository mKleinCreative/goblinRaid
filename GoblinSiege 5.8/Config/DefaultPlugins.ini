; ---------------------------------------------------------------------------------------------
; ACF GAS settings (#228, 2026-08-21). MEASURED AS EMPTY AT RUNTIME BEFORE THIS BLOCK EXISTED:
; the CDO reported HealthAttribute AttributeName="" and an empty HealthTag.
;
; ACF ships these values in its own Config/DefaultPlugins.ini, but they do not reach a project's
; config hierarchy, so every ACF GAS setting sat at its default.
;
; WHAT THAT BROKE, and it is not obvious from the names: UACFGASStatisticsComponent::BindHealthDelegate
; binds its death watcher to UARSFunctionLibrary::GetDefaultHealthAttribute(), which reads
; HealthAttribute from here. An empty attribute means the delegate binds to NOTHING - so health
; reaching zero was never noticed and **nothing in the game could die**. AACFCharacter::KillCharacter
; was inert too, because it routes through HealthTag.
;
; Note the tag is RPG.Statistic**s**.Health, plural. A singular RPG.Statistic.Health also exists in
; ACF's tag list; it is not the one this setting wants.
[/Script/AscentGASRuntime.ACFGASDeveloperSettings]
SerializableAttributes=/AscentCombatFramework/GASRuntime/ACF_SerializabeAttributes_DT.ACF_SerializabeAttributes_DT
AttributesByCurveRow=/AscentCombatFramework/GASRuntime/ACF_SerializabeAttributes_DT.ACF_SerializabeAttributes_DT
HealthAttribute=(AttributeName="Health",Attribute=/Script/AscentGASRuntime.ACFStatisticsSet:Health,AttributeOwner="/Script/CoreUObject.Class'/Script/AscentGASRuntime.ACFStatisticsSet'")
AttributesToSetByCallerTags=/AscentCombatFramework/GASRuntime/Config/ACF_AttributesSetByCallers_DT.ACF_AttributesSetByCallers_DT
StatsToSetByCallerTags=/AscentCombatFramework/GASRuntime/Config/ACF_StatsSetByCaller_DT.ACF_StatsSetByCaller_DT
DifficultyScalingTable=/AscentCombatFramework/Configuration/DifficultyConfig.DifficultyConfig
HealthTag=(TagName="RPG.Statistics.Health")

; ---------------------------------------------------------------------------------------------
; ACF UI settings (#335, ruling 71). Same story as the GAS block above and for the same reason:
; ACF ships these in its own Config/DefaultPlugins.ini and they DO NOT reach a project's config
; hierarchy. Left unset, the failures are silent and look nothing like their cause -
; SpawnWidgetByTag returns null with "Widget Registry not set", and every AUT widget draws unstyled.
;
; COPIED BY VALUE, NOT BY FILE. ACF's shipped block carries five defects that must not be
; replicated, all verified against the current headers on 2026-08-27:
;   - KeysConfigByPlatform uses the mount prefix /AscentUITools/, which does not exist. The assets
;     are real; the correct mount is /AscentCombatFramework/. Fixed below.
;   - WidgetRegistryAsset and IconsByTag point into /Game/FullSample/, which is NOT installed here.
;     Both are dangling. IconsByTag is therefore omitted entirely (the DataTable does not exist),
;     and WidgetRegistryAsset is deliberately left unset until stage 4 authors DA_GSWidgetRegistry -
;     a dangling path is the exact defect this comment exists to avoid repeating.
;   - DefaultMenuMapName / DefaultNewGameMapName are obsolete keys with no matching UPROPERTY.
;     Omitted.
[/Script/AscentUITools.AUTDeveloperSettings]
ThemesAsset=/AscentCombatFramework/UITools/Themes/ACFDarkTheme.ACFDarkTheme
DefaultLayerTag=(TagName="UI.Layer.Default")
KeysConfigByPlatform=(("Windows", "/AscentCombatFramework/UITools/Blueprints/WindowsConfig.WindowsConfig"),("Xbox", "/AscentCombatFramework/UITools/Blueprints/XboxConfig.XboxConfig"))

; DefaultSoundClasses - THE ORDER OF THIS ARRAY IS A LOAD-BEARING CONTRACT. DO NOT REORDER.
;
; UAUTGameUserSettings::AudioVolumeLevels is a bare TArray<float> - it stores no sound class
; reference, tag or name alongside a level. It is POSITIONAL: index n of AudioVolumeLevels means
; DefaultSoundClasses[n]. Reordering these lines silently reassigns every volume a player has
; already saved, so a Music setting becomes a Voice setting with no error anywhere.
;
;   0 = Master     1 = Music     2 = SFX     3 = Voice     4 = Ambience     5 = UI
;
; These are the PROJECT's classes (Content/Audio/Mix/Classes, #249), not ACF's SC_ANS* set. ACF's
; shipped value points at its own five classes, which no cue in this game is routed through - so
; leaving it as shipped would give sliders that move, save, persist and change nothing audible.
; SC_GS_Master is already the engine default in [/Script/Engine.AudioSettings].
;
; Six sliders, not thirteen: the finer classes (SFX_Player/NPC/Impact/World/Signal,
; Voice_Human/Creature) are mix structure, not player-facing choices, and they inherit from these.
+DefaultSoundClasses=/Game/Audio/Mix/Classes/SC_GS_Master.SC_GS_Master
+DefaultSoundClasses=/Game/Audio/Mix/Classes/SC_GS_Music.SC_GS_Music
+DefaultSoundClasses=/Game/Audio/Mix/Classes/SC_GS_SFX.SC_GS_SFX
+DefaultSoundClasses=/Game/Audio/Mix/Classes/SC_GS_Voice.SC_GS_Voice
+DefaultSoundClasses=/Game/Audio/Mix/Classes/SC_GS_Ambience.SC_GS_Ambience
+DefaultSoundClasses=/Game/Audio/Mix/Classes/SC_GS_UI.SC_GS_UI

